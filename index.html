const injectFonts = () => {

/* ─── UTILS ─── */
const $k = (n, d=1) => n>=1e6?`$${(n/1e6).toFixed(1)}M`:n>=1e3?`$${(n/1e3).toFixed(d)}K`:`$${Math.round(n).toLocaleString()}`;
const pct = n => `${Math.round(Math.max(0,n))}%`;
const fmt$ = n => `$${Math.round(Math.abs(n)).toLocaleString()}`;

/* ─── FIRE MATH ─────────────────────────────────────────────────────────────
   Inflation-adjusted (real return) FIRE calculation:
   - Real return = nominal - inflation (Fisher approx)
   - FIRE number = annual expenses / SWR (25x at 4% SWR)
   - Portfolio growth uses real monthly compounding
   - All projections in today's dollars
   - Family mode: expenses scaled by household size factor
──────────────────────────────────────────────────────────────────────────── */
function fireMath(income, expenses, assets, liabilities, rNominal=.07, swr=.04, inflation=.03) {
  const rReal = (1 + rNominal) / (1 + inflation) - 1;
  const rRealMo = rReal / 12;
  const monthlySavings = Math.max(0, income - expenses);
  const nw = assets - liabilities;
  const fireNum = (expenses * 12) / swr;
  const sR = income > 0 ? monthlySavings / income : 0;
  let yrs = 0;
  if (nw >= fireNum) {
    yrs = 0;
  } else if (monthlySavings <= 0) {
    yrs = 99;
  } else {
    let lo = 0, hi = 100;
    for (let i = 0; i < 80; i++) {
      const m = (lo + hi) / 2;
      const months = m * 12;
      const fv = rRealMo > 0
        ? nw * Math.pow(1 + rRealMo, months) + monthlySavings * (Math.pow(1 + rRealMo, months) - 1) / rRealMo
        : nw + monthlySavings * months;
      fv < fireNum ? lo = m : hi = m;
    }
    yrs = Math.max(0, (lo + hi) / 2);
  }
  const maxY = Math.min(Math.ceil(yrs) + 6, 55);
  const proj = [];
  for (let y = 0; y <= maxY; y++) {
    const months = y * 12;
    const v = rRealMo > 0
      ? nw * Math.pow(1 + rRealMo, months) + monthlySavings * (Math.pow(1 + rRealMo, months) - 1) / rRealMo
      : nw + monthlySavings * months;
    proj.push({ year: 2026 + y, nw: Math.round(v) });
  }
  return { fireNum, yrs, sR, as: monthlySavings * 12, ms: monthlySavings, proj, progress: fireNum > 0 ? Math.min(100, Math.max(0, nw / fireNum * 100)) : 0, nw, rReal };
}

function Fin({size=80,mood='happy',float=false}) {
  const scale = mood==='excited'?'scale(1.08)':'scale(1)';
  return (
    <div className={float?'bob':''} style={{display:'inline-block',width:size,height:size,transform:scale,transition:'transform .3s ease'}}>
      <img src={FIN_SRC} alt="Fin"
        style={{width:'100%',height:'100%',objectFit:'contain',display:'block'}}/>
    </div>
  );
}

/* ─── RING ─── */
function Ring({pct:p,size=108,stroke=10,color='#e8815a',bg='rgba(255,255,255,.25)'}) {
  const r=(size-stroke)/2, c=2*Math.PI*r, off=c-Math.min(100,p)/100*c;
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`} style={{transform:'rotate(-90deg)'}}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={bg} strokeWidth={stroke}/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke}
        strokeDasharray={c} strokeDashoffset={off} strokeLinecap="round"
        style={{transition:'stroke-dashoffset .9s ease'}}/>
    </svg>
  );
}

/* ─── SVG CHART (no recharts dep needed for projection) ─── */
function SVGChart({proj, fireNum, altProj, dark=false, height=150}) {
  const W=320,H=height,PX=8,PY=14;
  const all=[...proj.map(p=>p.nw),...(altProj||[]).map(p=>p.nw)];
  const maxY=Math.max(fireNum*1.08,...all), minY=Math.min(0,...all), rng=maxY-minY||1;
  const tx=i=>PX+i/Math.max(proj.length-1,1)*(W-PX*2);
  const ty=v=>PY+(1-(v-minY)/rng)*(H-PY*2);
  const line=proj.map((p,i)=>`${i===0?'M':'L'}${tx(i).toFixed(1)},${ty(p.nw).toFixed(1)}`).join(' ');
  const area=line+` L${tx(proj.length-1).toFixed(1)},${ty(minY).toFixed(1)} L${tx(0).toFixed(1)},${ty(minY).toFixed(1)}Z`;
  const fireY=ty(fireNum);
  let altL=null,altA=null;
  if(altProj?.length){
    const l=altProj.map((p,i)=>`${i===0?'M':'L'}${tx(i).toFixed(1)},${ty(p.nw).toFixed(1)}`).join(' ');
    altL=l; altA=l+` L${tx(altProj.length-1).toFixed(1)},${ty(minY).toFixed(1)} L${tx(0).toFixed(1)},${ty(minY).toFixed(1)}Z`;
  }
  const mc=dark?'#e8815a':'#e8815a';
  return (
    <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto',display:'block'}}>
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor={mc} stopOpacity=".25"/><stop offset="100%" stopColor={mc} stopOpacity="0"/></linearGradient>
        <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#8eba96" stopOpacity=".2"/><stop offset="100%" stopColor="#8eba96" stopOpacity="0"/></linearGradient>
      </defs>
      {fireY>PY&&fireY<H-PY&&<>
        <line x1={PX} y1={fireY} x2={W-PX} y2={fireY} stroke={mc} strokeWidth="1.5" strokeDasharray="5 4" opacity=".5"/>
        <text x={W-PX-2} y={fireY-4} fill={mc} fontSize="8" fontFamily="Nunito" fontWeight="700" textAnchor="end">FIRE target</text>
      </>}
      {altA&&<path d={altA} fill="url(#g2)"/>}
      {altL&&<path d={altL} fill="none" stroke="#8eba96" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" strokeDasharray="6 3" opacity=".9"/>}
      <path d={area} fill="url(#g1)"/>
      <path d={line} fill="none" stroke={mc} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/>
      <circle cx={tx(0)} cy={ty(proj[0]?.nw||0)} r="4.5" fill={mc}/>
      <circle cx={tx(0)} cy={ty(proj[0]?.nw||0)} r="2" fill="white"/>
    </svg>
  );
}

const Card = ({children,style={},onClick}) =>
  <div onClick={onClick} style={{background:CARD,borderRadius:24,padding:'18px 20px',boxShadow:'0 2px 20px rgba(44,26,14,.07)',...style,cursor:onClick?'pointer':'default'}}>{children}</div>;

/* ─── BUTTON ─── */
const Btn = ({children,onClick,variant='primary',full=false,style={}}) => {
  const b={border:'none',cursor:'pointer',fontFamily:SANS,fontWeight:700,fontSize:15,transition:'all .2s',display:'inline-flex',alignItems:'center',justifyContent:'center',gap:6,width:full?'100%':'auto'};
  const vs={
    primary:{background:DARK,color:'white',padding:'17px 28px',borderRadius:100,boxShadow:'0 4px 18px rgba(44,26,14,.25)'},
    coral:{background:CORAL,color:'white',padding:'17px 28px',borderRadius:100,boxShadow:'0 4px 18px rgba(232,129,90,.35)'},
    sm:{background:DARK,color:'white',padding:'8px 16px',borderRadius:100,fontSize:13},
    cream:{background:'#faeee2',color:DARK,padding:'15px 26px',borderRadius:100},
    ghost:{background:'transparent',color:INK,padding:'10px 20px',fontSize:14,borderRadius:100},
    pill:{background:DARK,color:'white',padding:'7px 14px',fontSize:13,borderRadius:100},
  };
  return <button onClick={onClick} style={{...b,...vs[variant],...style}}>{children}</button>;
};

const Label = ({children,color=INK}) =>
  <div style={{fontSize:10,fontWeight:700,color,textTransform:'uppercase',letterSpacing:'.1em',marginBottom:6}}>{children}</div>;

const InputRow = ({label,value,onChange,hint,min=0}) =>
  <div style={{marginBottom:18}}>
    <Label>{label}</Label>
    <div style={{position:'relative'}}>
      <span style={{position:'absolute',left:14,top:'50%',transform:'translateY(-50%)',color:INK,fontWeight:600,fontSize:16}}>$</span>
      <input type="number" value={value} min={min}
        onChange={e=>onChange(Math.max(min,Number(e.target.value)))}
        style={{width:'100%',padding:'14px 18px 14px 36px',border:`1.5px solid ${BORDER}`,borderRadius:14,fontFamily:SANS,fontSize:16,fontWeight:600,color:DARK,background:'white',outline:'none',appearance:'none'}}/>
    </div>
    {hint&&<div style={{fontSize:12,color:INK30,marginTop:5}}>{hint}</div>}
  </div>;

              {[['Income',fin.income,'#ddf0e2',SAGE],['Expenses',fin.expenses,'#fde4d7',CORAL]].map(([l,v,bg,c])=>
                <div key={l} style={{background:bg,borderRadius:16,padding:'14px'}}>
                  <div style={{fontSize:10,color:c,fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em',marginBottom:3}}>{l}</div>

                </div>
              )}
            </div>
          }
        </Card>

        {/* tip */}
        <div style={{background:'#c4bff7',borderRadius:24,padding:'18px 20px',display:'flex',gap:12,alignItems:'center',position:'relative',overflow:'hidden'}}>

          </div>
        </div>
      </div>
    </div>
  );
}

function detectCurrency(cityOrCountry) {
  if (!cityOrCountry) return { currency:'USD', rate:1, label:'US Dollar' };
  const q = cityOrCountry.toLowerCase();
  for (const entry of CURRENCY_MAP) {
    if (entry.keys.some(k => q.includes(k))) {
      return { currency:entry.currency, rate:entry.rate, label:entry.label };
    }
  }
  return { currency:'USD', rate:1, label:'US Dollar (assumed)' };
}

/* ── Scenario Engine ─────────────────────────────────────────── */
function applyScenarios(fin, scenarios) {
  let dI=0, dE=0, dA=0;
  scenarios.forEach(({def,params}) => {
    const impact = def.computeImpact(params, fin);
    dI += impact.dIncome; dE += impact.dExpenses; dA += impact.dAssets;
  });
  return { income:Math.max(0,fin.income+dI), expenses:Math.max(0,fin.expenses+dE), assets:fin.assets+dA, liabilities:fin.liabilities };
}

/* ── Goal Gap Engine ─────────────────────────────────────────── */
function calcGoalGap(fin, targetYrs, tweaks) {
  const rR=(tweaks?.returnRate||7)/100, swr=(tweaks?.safeWithdrawal||4)/100, inf=(tweaks?.inflation||3)/100;
  const base = fireMath(fin.income, fin.expenses, fin.assets, fin.liabilities, rR, swr, inf);
  if (base.yrs <= targetYrs) return null;
  let lo=0, hi=fin.income;
  for (let i=0;i<60;i++) { const m=(lo+hi)/2; fireMath(fin.income+m,fin.expenses,fin.assets,fin.liabilities,rR,swr,inf).yrs>targetYrs?lo=m:hi=m; }
  const reqInc = Math.ceil((lo+hi)/2/50)*50;
  lo=0; hi=fin.expenses;
  for (let i=0;i<60;i++) { const m=(lo+hi)/2; fireMath(fin.income,fin.expenses-m,fin.assets,fin.liabilities,rR,swr,inf).yrs>targetYrs?lo=m:hi=m; }
  const reqExp = Math.ceil((lo+hi)/2/50)*50;
  return { baseYrs:Math.round(base.yrs), targetYrs, gapYrs:Math.round(base.yrs-targetYrs), requiredIncomeIncrease:reqInc, requiredExpenseReduction:reqExp };
}

/* ── Chart Data Builder ─────────────────────────────────────── */
function buildChartData(baseRes, scenRes) {
  const maxY = Math.min(Math.max((baseRes.fireYear||30)+8, scenRes?(scenRes.fireYear||30)+8:0, 30)+2, 45);
  return baseRes.proj
    .filter(d => d.year <= 2026+maxY)
    .map((d,i) => ({ year:d.year, age:28+i, base:d.nw, scenario:scenRes?scenRes.proj[i]?.nw:undefined, fireTarget:baseRes.fireNum }));
}

/* ── Timeline Chart with X-axis year labels ──────────────────── */
function ScenarioChart({ chartData, baseRes, scenRes, hasScenario }) {
  const W=320, H=170, PL=46, PR=10, PT=14, PB=22;
  const IW=W-PL-PR, IH=H-PT-PB;
  if (!chartData || chartData.length < 2) return null;

  const all = chartData.flatMap(d=>[d.base, d.scenario].filter(v=>v!=null));
  const maxV = Math.max(baseRes.fireNum*1.08, ...all);
  const minV = Math.min(0, ...all);
  const rng = maxV-minV || 1;

  const tx = i => PL + (i/Math.max(chartData.length-1,1))*IW;
  const ty = v => PT + (1-(v-minV)/rng)*IH;

  const baseLine  = chartData.map((d,i)=>`${i===0?'M':'L'}${tx(i).toFixed(1)},${ty(d.base).toFixed(1)}`).join(' ');
  const baseArea  = baseLine + ` L${tx(chartData.length-1).toFixed(1)},${(PT+IH).toFixed(1)} L${PL},${(PT+IH).toFixed(1)}Z`;
  const scenLine  = hasScenario
    ? chartData.map((d,i)=>`${i===0?'M':'L'}${tx(i).toFixed(1)},${ty(d.scenario!=null?d.scenario:d.base).toFixed(1)}`).join(' ')
    : null;
  const fireY = ty(baseRes.fireNum);
  const fireYear = 2026+Math.round(baseRes.yrs);
  const fireIdx  = chartData.findIndex(d=>d.year>=fireYear);

  // X-axis tick years — pick ~5 evenly spaced
  const tickCount = 5;
  const step = Math.max(1, Math.floor(chartData.length/tickCount));
  const ticks = chartData.filter((_,i)=>i%step===0||i===chartData.length-1);

  // Y-axis ticks
  const yTickCount = 4;
  const yTicks = Array.from({length:yTickCount+1},(_,i)=>minV+(maxV-minV)*i/yTickCount);

  const diff = scenRes ? scenRes.yrs - baseRes.yrs : 0;
  const better = diff < -0.4, worse = diff > 0.4;

  return (
    <div style={{background:'white',borderRadius:20,padding:'16px 14px 12px',boxShadow:'0 2px 12px rgba(44,26,14,.06)',marginBottom:14}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:10}}>
        <div>
          <div style={{fontSize:13,fontWeight:800,color:DARK}}>Net Worth Projection</div>
          <div style={{fontSize:11,color:INK,marginTop:2}}>{hasScenario?'Baseline vs scenario · real return':'Your current trajectory · real return'}</div>
        </div>
        <div style={{display:'flex',flexDirection:'column',alignItems:'flex-end',gap:4}}>
          {baseRes.yrs < 99 && (
            <div style={{fontSize:10,fontWeight:700,color:'#059669',background:'#ddf0e2',padding:'3px 9px',borderRadius:100}}>
              Base FIRE {fireYear}
            </div>
          )}
          {hasScenario && scenRes && scenRes.yrs < 99 && (
            <div style={{fontSize:10,fontWeight:700,color:better?'#059669':CORAL,background:better?'#ddf0e2':'#fde4d7',padding:'3px 9px',borderRadius:100}}>
              Scenario {2026+Math.round(scenRes.yrs)} {better?'🎉':'⚠️'}
            </div>
          )}
        </div>
      </div>

      <svg viewBox={`0 0 ${W} ${H}`} style={{width:'100%',height:'auto',display:'block'}}>
        <defs>
          <linearGradient id="bg1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={CORAL} stopOpacity=".18"/>
            <stop offset="100%" stopColor={CORAL} stopOpacity="0"/>
          </linearGradient>
          <linearGradient id="bg2" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stopColor={SAGE} stopOpacity=".15"/>
            <stop offset="100%" stopColor={SAGE} stopOpacity="0"/>
          </linearGradient>
        </defs>

        {/* Y grid lines */}

            <line x1={PL} y1={ty(v)} x2={W-PR} y2={ty(v)} stroke="#f0e8e0" strokeWidth="1"/>
            <text x={PL-4} y={ty(v)+3.5} fill={INK} fontSize="8" fontFamily="Nunito" textAnchor="end">

            </text>
          </g>
        ))}

        {/* FIRE target line */}
        {fireY>PT && fireY<PT+IH && (
          <>
            <line x1={PL} y1={fireY} x2={W-PR} y2={fireY} stroke="#059669" strokeWidth="1.2" strokeDasharray="4 3" opacity=".6"/>
            <text x={PL+3} y={fireY-3} fill="#059669" fontSize="8" fontFamily="Nunito" fontWeight="700">FIRE target</text>

          </>
        )}

        {/* FIRE crossover dot on baseline */}
        {fireIdx>=0 && fireIdx<chartData.length && (
          <circle cx={tx(fireIdx)} cy={ty(baseRes.fireNum)} r="5" fill="white" stroke={CORAL} strokeWidth="2.5"/>
        )}

        {/* X-axis labels */}
        {ticks.map((d,i)=>(
          <text key={i} x={tx(chartData.indexOf(d))} y={H-4} fill={INK} fontSize="8" fontFamily="Nunito" textAnchor="middle">
            {d.year}
          </text>
        ))}

        {/* X-axis baseline */}
        <line x1={PL} y1={PT+IH} x2={W-PR} y2={PT+IH} stroke="#e0d8d0" strokeWidth="1"/>
      </svg>

      {/* Legend */}
      <div style={{display:'flex',gap:14,paddingTop:6}}>
        <div style={{display:'flex',alignItems:'center',gap:5,fontSize:10,color:INK,fontWeight:600}}>
          <div style={{width:12,height:3,background:CORAL,borderRadius:2}}/> Baseline
        </div>
        {hasScenario && <div style={{display:'flex',alignItems:'center',gap:5,fontSize:10,color:INK,fontWeight:600}}>
          <div style={{width:12,height:2,background:better?'#059669':CORAL,borderRadius:2,borderTop:`2px dashed ${better?'#059669':CORAL}`}}/> Scenario
        </div>}
      </div>
    </div>
  );
}

/* ── Question Flow Modal ─────────────────────────────────────── */
function QuestionFlow({ def, answers, onSave, onClose }) {
  const [step, setStep] = useState(0);
  const [vals, setVals] = useState({ ...def.defaults, ...answers });
  const questions = def.questions;
  const q = questions[step];
  const isLast = step === questions.length - 1;
  const currentVal = vals[q.key];
  const isEmpty = currentVal === '' || currentVal === null || currentVal === undefined;
  const isRequired = def.requiredKeys.includes(q.key);
  const canNext = !isRequired || !isEmpty;

  const inputStyle = {
    width:'100%', boxSizing:'border-box', padding:'14px 16px',
    background:'#faeee2', border:'none', borderRadius:14,
    fontFamily:SANS, fontSize:18, fontWeight:700, color:DARK, outline:'none',
    textAlign:'left',
  };

  return (
    <div style={{position:'absolute',inset:0,background:'rgba(28,15,6,.55)',zIndex:100,display:'flex',alignItems:'flex-end',justifyContent:'center',minHeight:'100%'}}
      onClick={e=>{ if(e.target===e.currentTarget) onClose(); }}>
      <div style={{background:'white',borderRadius:'28px 28px 0 0',width:'100%',maxWidth:500,padding:'28px 24px 40px',boxShadow:'0 -8px 40px rgba(44,26,14,.18)'}}>

        {/* Step indicator */}
        <div style={{display:'flex',gap:5,marginBottom:20,justifyContent:'center'}}>
          {questions.map((_,i)=>(
            <div key={i} style={{height:4,flex:1,borderRadius:2,background:i<=step?def.accentColor:'#ede4dc',transition:'background .3s'}}/>
          ))}
        </div>

        {/* Icon + label */}
        <div style={{display:'flex',alignItems:'center',gap:10,marginBottom:6}}>
          <div style={{width:36,height:36,background:def.color,borderRadius:11,display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>{def.icon}</div>
          <div style={{fontSize:11,fontWeight:700,color:def.accentColor,textTransform:'uppercase',letterSpacing:'.08em'}}>{def.label}</div>
        </div>

        {/* Question */}
        <div style={{fontFamily:SERIF,fontSize:22,color:DARK,lineHeight:1.25,marginBottom:4,fontWeight:500}}>{q.label}</div>
        {q.hint && (typeof q.hint === 'function' ? q.hint(vals) : q.hint) ? <div style={{fontSize:12,color:INK,marginBottom:12}}>{typeof q.hint==='function'?q.hint(vals):q.hint}</div> : null}
        {q.renderExtra && q.renderExtra(vals) && (
          <div style={{marginBottom:12,padding:'8px 12px',background:def.color,borderRadius:10,fontSize:12,fontWeight:700,color:def.accentColor}}>
            ✓ {q.renderExtra(vals)}
          </div>
        )}
        

        {/* Input */}
        {q.type === 'text' && (
          <input type="text" placeholder={q.placeholder} value={currentVal||''}
            onChange={e=>setVals(v=>({...v,[q.key]:e.target.value}))}
            style={inputStyle} autoFocus/>
        )}
        {(q.type === 'currency' || q.type === 'number') && (
          <div style={{position:'relative'}}>
            {q.type==='currency' && <span style={{position:'absolute',left:16,top:'50%',transform:'translateY(-50%)',fontSize:18,fontWeight:700,color:INK}}>$</span>}
            <input type="number" placeholder={q.placeholder} value={currentVal===''?'':currentVal}
              onChange={e=>setVals(v=>({...v,[q.key]:e.target.value===''?'':+e.target.value}))}
              min={q.min} max={q.max}
              style={{...inputStyle,paddingLeft:q.type==='currency'?36:16}} autoFocus/>
          </div>
        )}
        {q.type === 'percent' && (
          <div style={{position:'relative'}}>
            <input type="number" placeholder={q.placeholder} value={currentVal===''?'':currentVal}
              onChange={e=>setVals(v=>({...v,[q.key]:e.target.value===''?'':+e.target.value}))}
              min={q.min} max={q.max} step={0.5}
              style={inputStyle} autoFocus/>
            <span style={{position:'absolute',right:16,top:'50%',transform:'translateY(-50%)',fontSize:18,fontWeight:700,color:INK}}>%</span>
          </div>
        )}
        {q.type === 'choice' && (
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {q.choices.map((choice,i)=>{
              const v = q.choiceValues?.[i] ?? choice;
              const sel = currentVal === v;
              return (
                <button key={i} onClick={()=>setVals(vv=>({...vv,[q.key]:v}))}
                  style={{padding:'13px 16px',borderRadius:14,border:`2px solid ${sel?def.accentColor:'#ede4dc'}`,background:sel?def.color:'white',fontFamily:SANS,fontSize:14,fontWeight:sel?700:500,color:sel?DARK:INK,cursor:'pointer',textAlign:'left',transition:'all .15s'}}>
                  {sel && <span style={{marginRight:8}}>✓</span>}{choice}
                </button>
              );
            })}
          </div>
        )}

        {/* Skip / required hint */}
        {!isRequired && (
          <div style={{fontSize:11,color:INK,marginTop:8,textAlign:'center'}}>Optional — tap Next to skip</div>
        )}

        {/* Nav buttons */}
        <div style={{display:'flex',gap:10,marginTop:20}}>
          {step > 0 && (
            <button onClick={()=>setStep(s=>s-1)}
              style={{flex:1,padding:'14px',borderRadius:14,border:'none',background:'#f5ede6',color:DARK,fontFamily:SANS,fontSize:14,fontWeight:700,cursor:'pointer'}}>
              ← Back
            </button>
          )}
          <button onClick={()=>{
              if(isLast){ onSave(vals); }
              else {
                const nextVals = q.onNext ? q.onNext(currentVal, vals) : vals;
                setVals(nextVals);
                setStep(s=>s+1);
              }
            }}
            disabled={isRequired && isEmpty}
            style={{flex:2,padding:'14px',borderRadius:14,border:'none',background:canNext?def.accentColor:'#ede4dc',color:canNext?'white':INK,fontFamily:SANS,fontSize:14,fontWeight:700,cursor:canNext?'pointer':'not-allowed',transition:'background .2s'}}>
            {isLast ? 'Apply to my plan →' : 'Next →'}
          </button>
        </div>

        {/* Close */}
        <button onClick={onClose}
          style={{display:'block',margin:'14px auto 0',background:'none',border:'none',fontSize:12,color:INK,cursor:'pointer',fontFamily:SANS}}>
          Cancel
        </button>
      </div>
    </div>
  );
}

/* ── Scenario Toggle Card ─────────────────────────────────────── */
function ScenarioToggleCard({ def, active, answered, params, impact, onToggle, onEdit }) {
  const hasAnswers = answered;
  const canToggle  = hasAnswers;

  return (
    <div style={{background:'white',borderRadius:18,overflow:'hidden',boxShadow:'0 2px 10px rgba(44,26,14,.06)',marginBottom:10,border:active?`1.5px solid ${def.accentColor}`:'1.5px solid transparent',transition:'all .2s',opacity:!hasAnswers&&!active?0.85:1}}>
      {active && <div style={{height:3,background:def.accentColor,borderRadius:'18px 18px 0 0'}}/>}

      <div style={{display:'flex',alignItems:'center',gap:12,padding:'14px 16px'}}>
        {/* Icon */}
        <div style={{width:42,height:42,background:def.color,borderRadius:13,display:'flex',alignItems:'center',justifyContent:'center',fontSize:20,flexShrink:0}}>{def.icon}</div>

        {/* Label + summary */}
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:14,fontWeight:700,color:DARK}}>{def.label}</div>
          {active && impact && (
            <div style={{fontSize:11,color:def.accentColor,fontWeight:600,marginTop:2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{impact.summary}</div>
          )}
          {!hasAnswers && (
            <div style={{fontSize:11,color:INK,marginTop:2}}>Tap to set up</div>
          )}
        </div>

        {/* Edit link — only shown when answered */}
        {hasAnswers && (
          <button onClick={e=>{e.stopPropagation();onEdit();}}
            style={{fontSize:11,fontWeight:700,color:def.accentColor,background:'none',border:'none',cursor:'pointer',fontFamily:SANS,flexShrink:0,padding:'4px 6px',textDecoration:'underline'}}>
            Edit
          </button>
        )}

        {/* Toggle — disabled until answered */}
        <div
          onClick={e=>{ e.stopPropagation(); if(canToggle) onToggle(); else onEdit(); }}
          style={{width:44,height:26,borderRadius:13,background:active?def.accentColor:canToggle?BORDER:'#f0ebe6',position:'relative',cursor:canToggle?'pointer':'default',transition:'background .2s',flexShrink:0,opacity:!canToggle?0.55:1}}>
          <div style={{position:'absolute',top:3,left:active?20:3,width:20,height:20,borderRadius:'50%',background:'white',boxShadow:'0 1px 4px rgba(0,0,0,.2)',transition:'left .2s'}}/>
        </div>
      </div>
    </div>
  );
}

/* ── Scenario Comparison Panel ───────────────────────────────── */
function ScenarioComparisonPanel({ baseRes, scenRes, activeScenarios }) {
  if (!scenRes || activeScenarios.length===0) return null;
  const diff = scenRes.yrs - baseRes.yrs;
  const better=diff<-0.4, worse=diff>0.4;
  const bgColor = better?'#ddf0e2':worse?'#fde4d7':'#f3f4f6';
  const textColor = better?'#059669':worse?CORAL:INK;
  const label = better?`${Math.abs(Math.round(diff))}y earlier 🎉`:worse?`${Math.round(diff)}y later ⚠️`:'No change';

  const keyYears = [5,10,20];
  const deltas = keyYears.map(yr=>({
    yr,
    delta:(scenRes.proj.find(d=>d.year===2026+yr)?.nw||0)-(baseRes.proj.find(d=>d.year===2026+yr)?.nw||0),
  }));

  return (
    <div style={{background:bgColor,borderRadius:18,padding:'14px 16px',marginBottom:14}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
        <div style={{fontSize:12,fontWeight:800,color:DARK}}>{activeScenarios.map(s=>s.def.icon).join(' ')} Combined impact</div>
        <div style={{fontSize:13,fontWeight:800,color:textColor}}>{label}</div>
      </div>
      <div style={{display:'flex',gap:8}}>
        {deltas.map(({yr,delta})=>(
          <div key={yr} style={{flex:1,background:'rgba(255,255,255,.7)',borderRadius:12,padding:'10px 8px',textAlign:'center'}}>
            <div style={{fontSize:9,color:INK,fontWeight:700,textTransform:'uppercase',letterSpacing:'.06em',marginBottom:4}}>+{yr}y</div>
            <div style={{fontSize:13,fontWeight:800,color:delta>=0?'#059669':CORAL}}>{delta>=0?'+':''}{$k(delta)}</div>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ── Goal Gap Card ───────────────────────────────────────────── */
function GoalGapCard({ fin, baseRes, tweaks }) {
  const [targetYrs, setTargetYrs] = useState(Math.max(5,Math.round(baseRes.yrs)-3));
  const gap = useMemo(()=>calcGoalGap(fin, targetYrs, tweaks),[fin,targetYrs,tweaks]);

  return (
    <div style={{background:DARK,borderRadius:20,padding:'18px',color:'white',position:'relative',overflow:'hidden'}}>
      <Squiggle style={{position:'absolute',top:12,right:14,opacity:.25}} color={CORAL}/>
      <div style={{fontSize:10,fontWeight:700,color:CORAL,textTransform:'uppercase',letterSpacing:'.1em',marginBottom:6}}>🎯 Goal-Driven Optimization</div>
      <div style={{fontFamily:SERIF,fontSize:20,color:'white',marginBottom:14,fontWeight:500}}>
        Reach FIRE in <em style={{color:CORAL}}>{targetYrs} years</em>
      </div>
      <div style={{marginBottom:14}}>
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:5}}>
          <span style={{fontSize:11,color:'rgba(255,255,255,.5)'}}>Target</span>
          <span style={{fontSize:12,fontWeight:700,color:CORAL}}>{targetYrs}y</span>
        </div>
        <div style={{position:'relative',height:6,background:'rgba(255,255,255,.15)',borderRadius:3}}>
          <div style={{position:'absolute',left:0,top:0,height:'100%',width:`${((targetYrs-5)/(50-5))*100}%`,background:CORAL,borderRadius:3}}/>
          <input type="range" min={5} max={50} step={1} value={targetYrs}
            onChange={e=>setTargetYrs(+e.target.value)}
            style={{position:'absolute',inset:0,width:'100%',opacity:0,cursor:'pointer',height:'100%',margin:0}}/>
        </div>
      </div>
      {gap===null
        ? <div style={{background:'rgba(5,150,105,.2)',border:'1px solid rgba(5,150,105,.3)',borderRadius:14,padding:'12px 14px',fontSize:13,color:'#6ee7b7',fontWeight:600}}>✓ Already on track — ahead of your target!</div>
        : <>
            <div style={{fontSize:12,color:'rgba(255,255,255,.55)',marginBottom:10}}>Currently {gap.baseYrs}y — close a <strong style={{color:CORAL}}>{gap.gapYrs}y gap</strong> by:</div>
            <div style={{display:'flex',gap:8}}>
              <div style={{flex:1,background:'rgba(255,255,255,.07)',border:'1px solid rgba(200,80,58,.3)',borderRadius:14,padding:'12px 10px'}}>
                <div style={{fontSize:9,color:'rgba(255,255,255,.45)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.06em',marginBottom:4}}>Cut Expenses</div>
                <div style={{fontFamily:SERIF,fontSize:18,color:CORAL,fontWeight:500}}>−${gap.requiredExpenseReduction.toLocaleString()}<span style={{fontSize:11}}>/mo</span></div>
              </div>
              <div style={{alignSelf:'center',fontSize:10,fontWeight:700,color:'rgba(255,255,255,.3)'}}>OR</div>
              <div style={{flex:1,background:'rgba(255,255,255,.07)',border:'1px solid rgba(142,186,150,.3)',borderRadius:14,padding:'12px 10px'}}>
                <div style={{fontSize:9,color:'rgba(255,255,255,.45)',fontWeight:700,textTransform:'uppercase',letterSpacing:'.06em',marginBottom:4}}>Earn More</div>
                <div style={{fontFamily:SERIF,fontSize:18,color:SAGE,fontWeight:500}}>+${gap.requiredIncomeIncrease.toLocaleString()}<span style={{fontSize:11}}>/mo</span></div>
              </div>
            </div>
          </>
      }
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════════
   PROJECTIONS SCREEN
═══════════════════════════════════════════════════════════════ */
function ProjectionsScreen({fin, res, tweaks}) {
  // NOTE: QuestionFlow overlay uses position:absolute — parent needs relative
  const [activeScenarios, setActiveScenarios] = useState([]);
  const [answeredParams, setAnsweredParams]   = useState({});
  const [flowOpen, setFlowOpen]               = useState(null);
  const [customScenarios, setCustomScenarios] = useState([]);   // user-created custom scenarios
  const [showCustomForm, setShowCustomForm]   = useState(false);
  const [customDraft, setCustomDraft]         = useState({ label:'', icon:'✏️', incomeChange:'', expenseChange:'', assetChange:'' });

  const isAnswered = id => !!answeredParams[id];
  const isActive   = id => !!activeScenarios.find(s=>s.id===id);

  const openFlow = (id) => setFlowOpen(id);

  const saveAnswers = (id, vals) => {
    setAnsweredParams(prev=>({...prev,[id]:vals}));
    setFlowOpen(null);
    // Auto-activate after answering
    const def = SCENARIO_DEFS[id];
    setActiveScenarios(prev => {
      if (prev.find(s=>s.id===id)) return prev.map(s=>s.id===id?{...s,params:vals}:s);
      return [...prev, {id, def, params:vals}];
    });
  };

  const toggleScenario = (id) => {
    setActiveScenarios(prev=>
      prev.find(s=>s.id===id)
        ? prev.filter(s=>s.id!==id)
        : [...prev, {id, def:SCENARIO_DEFS[id], params:answeredParams[id]}]
    );
  };

  const hasActive = activeScenarios.length > 0;

  const scenFin = hasActive
    ? applyScenarios(fin, activeScenarios.map(s=>({def:s.def,params:s.params})))
    : null;

  const scenRes = useMemo(()=>{
    if (!scenFin) return null;
    return fireMath(scenFin.income, scenFin.expenses, scenFin.assets, scenFin.liabilities,
      (tweaks?.returnRate||7)/100,(tweaks?.safeWithdrawal||4)/100,(tweaks?.inflation||3)/100);
  },[scenFin,tweaks]);

  const chartData = useMemo(()=>buildChartData(res,scenRes),[res,scenRes]);
  const diff = scenRes ? scenRes.yrs - res.yrs : 0;
  const better = diff<-0.4, worse=diff>0.4;

  return (
    <div style={{position:'relative'}}>
      {/* Question flow modal */}
      {flowOpen && (
        <QuestionFlow
          def={SCENARIO_DEFS[flowOpen]}
          answers={answeredParams[flowOpen]||{}}
          onSave={vals=>saveAnswers(flowOpen,vals)}
          onClose={()=>setFlowOpen(null)}
        />
      )}

      {/* Header */}
      <div style={{background:DARK,borderBottomLeftRadius:36,borderBottomRightRadius:36,padding:'12px 22px 24px',color:'white',position:'relative',overflow:'hidden'}}>
        <div style={{position:'absolute',top:-20,right:-20,width:100,height:100,borderRadius:'50%',background:'rgba(255,255,255,.04)'}}/>
        <div style={{fontSize:10,fontWeight:700,color:CORAL,textTransform:'uppercase',letterSpacing:'.1em',marginBottom:4}}>What if...</div>
        <div style={{fontFamily:SERIF,fontSize:28,color:'white',letterSpacing:'-.5px',lineHeight:1.1,fontWeight:500}}>Life scenarios</div>
        <div style={{fontSize:13,color:INK30,marginTop:6,lineHeight:1.5}}>Answer a few questions about each life event to see how it shifts your FIRE date.</div>
        {hasActive && (
          <div style={{marginTop:12,display:'inline-flex',alignItems:'center',gap:8,background:better?'rgba(5,150,105,.2)':worse?'rgba(200,80,58,.2)':'rgba(255,255,255,.1)',borderRadius:100,padding:'7px 14px',border:`1px solid ${better?'rgba(5,150,105,.4)':worse?'rgba(200,80,58,.4)':'rgba(255,255,255,.15)'}`}}>
            <span style={{fontSize:14}}>{better?'🎉':worse?'⚠️':'➡️'}</span>
            <span style={{fontSize:13,fontWeight:700,color:better?'#6ee7b7':worse?'#fca5a5':'white'}}>
              {better?`FIRE ${Math.abs(Math.round(diff))}y earlier`:worse?`FIRE ${Math.round(diff)}y later`:'No FIRE impact'}
            </span>
            <span style={{fontSize:11,color:'rgba(255,255,255,.45)'}}>vs baseline {Math.round(res.yrs)}y</span>
          </div>
        )}
      </div>

      <div style={{padding:'16px 14px 28px',background:BG}}>
        {/* Chart */}
        <ScenarioChart chartData={chartData} baseRes={res} scenRes={scenRes} hasScenario={hasActive}/>

        {/* Comparison */}
        <ScenarioComparisonPanel baseRes={res} scenRes={scenRes} activeScenarios={activeScenarios}/>

        {/* Scenario cards */}
        <div style={{fontSize:11,fontWeight:700,color:INK,textTransform:'uppercase',letterSpacing:'.08em',marginBottom:10}}>Life events</div>
        {Object.values(SCENARIO_DEFS).map(def=>{
          const active   = isActive(def.id);
          const answered = isAnswered(def.id);
          const params   = answeredParams[def.id];
          const impact   = active && params ? def.computeImpact(params,fin) : null;
          return (
            <ScenarioToggleCard key={def.id}
              def={def} active={active} answered={answered} params={params} impact={impact}
              onToggle={()=>toggleScenario(def.id)}
              onEdit={()=>openFlow(def.id)}
            />
          );
        })}

        {/* Custom scenario cards */}
        {customScenarios.map(cs=>{
          const active = !!activeScenarios.find(s=>s.id===cs.id);
          const impact = { dIncome:+cs.incomeChange||0, dExpenses:+cs.expenseChange||0, dAssets:+cs.assetChange||0,
            summary:(()=>{
              const parts=[];
              if(cs.incomeChange) parts.push('income '+(+cs.incomeChange>0?'+':'')+"$"+Math.abs(+cs.incomeChange)+'/mo');
              if(cs.expenseChange) parts.push('expenses '+(+cs.expenseChange>0?'+':'')+"$"+Math.abs(+cs.expenseChange)+'/mo');
              if(cs.assetChange) parts.push('assets '+(+cs.assetChange>0?'+':'')+"$"+Math.abs(+cs.assetChange));
              return parts.join(', ')||'Custom event';
            })() };
          return (
            <div key={cs.id} style={{background:'white',borderRadius:18,overflow:'hidden',boxShadow:'0 2px 10px rgba(44,26,14,.06)',marginBottom:10,border:active?`1.5px solid #7c3aed`:'1.5px solid transparent'}}>
              {active&&<div style={{height:3,background:'#7c3aed'}}/>}
              <div style={{display:'flex',alignItems:'center',gap:12,padding:'14px 16px'}}>
                <div style={{width:42,height:42,background:'#ecebfc',borderRadius:13,display:'flex',alignItems:'center',justifyContent:'center',fontSize:20,flexShrink:0}}>{cs.icon}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:14,fontWeight:700,color:DARK}}>{cs.label||'Custom event'}</div>
                  {active&&<div style={{fontSize:11,color:'#7c3aed',fontWeight:600,marginTop:2,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{impact.summary}</div>}
                </div>
                <button onClick={()=>{setCustomDraft(cs);setShowCustomForm(cs.id);}}
                  style={{fontSize:11,fontWeight:700,color:'#7c3aed',background:'none',border:'none',cursor:'pointer',fontFamily:SANS,textDecoration:'underline',flexShrink:0,padding:'4px 6px'}}>Edit</button>
                <button onClick={()=>setCustomScenarios(p=>p.filter(s=>s.id!==cs.id))}
                  style={{fontSize:11,color:INK,background:'none',border:'none',cursor:'pointer',fontFamily:SANS,flexShrink:0,padding:'4px 6px'}}>✕</button>
                <div onClick={()=>{
                    if(active) setActiveScenarios(p=>p.filter(s=>s.id!==cs.id));
                    else setActiveScenarios(p=>[...p,{id:cs.id,def:{computeImpact:()=>impact},params:cs}]);
                  }}
                  style={{width:44,height:26,borderRadius:13,background:active?'#7c3aed':BORDER,position:'relative',cursor:'pointer',transition:'background .2s',flexShrink:0}}>
                  <div style={{position:'absolute',top:3,left:active?20:3,width:20,height:20,borderRadius:'50%',background:'white',boxShadow:'0 1px 4px rgba(0,0,0,.2)',transition:'left .2s'}}/>
                </div>
              </div>
            </div>
          );
        })}

        {/* Add custom event button */}
        {!showCustomForm && (
          <button onClick={()=>{setCustomDraft({label:'',icon:'✏️',incomeChange:'',expenseChange:'',assetChange:'',id:'custom_'+Date.now()});setShowCustomForm('new');}}

  {id:'1m',label:'This month (Apr 2026)', months:1, mults:[1]},
  {id:'3m',label:'Last 3 months',         months:3, mults:[1,0.94,1.06]},
  {id:'6m',label:'Last 6 months',         months:6, mults:[1,0.94,1.06,0.98,1.03,0.97]},
  {id:'1y',label:'Last 12 months',        months:12,mults:[1,0.94,1.06,0.98,1.03,0.97,1.01,0.96,1.05,0.99,1.02,0.95]},
];

function makeTxns(expenses) {
  const txns=[]; let id=0;
  CATS.forEach(c=>{
    const catTotal=Math.round(expenses*c.ratio);
    const ms=MERCHANTS[c.name]||[];
    let rem=catTotal;
    ms.forEach((m,i)=>{
      const isLast=i===ms.length-1;
      const a=isLast?rem:Math.max(5,Math.round(catTotal*m.a*(0.85+Math.random()*0.3)));
      rem=Math.max(0,rem-a);
      const day=Math.max(1,Math.min(28,Math.floor(Math.random()*28)+1));
      txns.push({id:++id,merchant:m.n,amount:a,cat:c.name,color:c.color,bg:c.bg,icon:c.icon,day});
    });
  });
  return txns.sort((a,b)=>b.day-a.day);
}

                )}
                {isOpen&&cat.save===0&&(
                  <div style={{background:'#f0f7f2',borderRadius:14,padding:'10px 14px',fontSize:13,color:'#3d7a52'}}>💚 {cat.tip}</div>
                )}
              </div>
            );
          })}

          <div style={{background:DARK,borderRadius:22,padding:'18px 20px',display:'flex',gap:12,alignItems:'flex-start',position:'relative',overflow:'hidden',color:'white',marginTop:4}}>
            <Squiggle style={{position:'absolute',top:10,right:12}} color={CORAL}/>
            <div style={{fontSize:26,flexShrink:0}}>🎯</div>
            <div>
              <div style={{fontSize:10,fontWeight:700,color:CORAL,textTransform:'uppercase',letterSpacing:'.1em',marginBottom:4}}>Goal-driven tip</div>
              <div style={{fontSize:13,color:'white',lineHeight:1.6}}>
                Reduce by <strong style={{color:CORAL}}>${Math.round(totalSave).toLocaleString()}/mo</strong> or earn <strong style={{color:'#c4bff7'}}>${Math.round(totalSave*1.3/50)*50}/mo</strong> more → <strong style={{color:'white'}}>{Math.round(yrsSaved)}y sooner</strong> to FIRE.
              </div>
            </div>
          </div>
        </div>
      )}

      {view==='transactions'&&(
        <div style={{padding:'0 14px 28px',background:BG}}>
          <div style={{fontSize:11,color:INK,fontWeight:700,marginBottom:10,textTransform:'uppercase',letterSpacing:'.08em'}}>{allTxns.length} transactions · Apr 2026</div>
          <div style={{background:CARD,borderRadius:22,overflow:'hidden',boxShadow:'0 2px 14px rgba(44,26,14,.06)'}}>
            {allTxns.map((txn,i)=>(
              <div key={txn.id} style={{display:'flex',alignItems:'center',gap:12,padding:'13px 16px',borderBottom:i<allTxns.length-1?`1px solid ${BORDER}`:'none'}}>
                <div style={{width:38,height:38,background:txn.bg,borderRadius:12,display:'flex',alignItems:'center',justifyContent:'center',fontSize:17,flexShrink:0}}>{txn.icon}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:14,fontWeight:700,color:DARK,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{txn.merchant}</div>
                  <div style={{fontSize:11,color:INK30,marginTop:2}}>Apr {txn.day} · {txn.cat}</div>
                </div>
                <div style={{fontFamily:SERIF,fontSize:16,color:DARK,letterSpacing:'-.3px',flexShrink:0,fontWeight:500}}>−${txn.amount.toLocaleString()}</div>
              </div>
            ))}
          </div>
          <div style={{background:CARD,borderRadius:18,padding:'14px 18px',marginTop:10,boxShadow:'0 2px 10px rgba(44,26,14,.05)',display:'flex',justifyContent:'space-between'}}>
            <div>
              <div style={{fontSize:10,color:INK,fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em'}}>Total spent</div>
              <div style={{fontFamily:SERIF,fontSize:18,color:DARK,letterSpacing:'-.3px',fontWeight:500}}>${allTxns.reduce((s,t)=>s+t.amount,0).toLocaleString()}</div>
            </div>
            <div style={{textAlign:'right'}}>
              <div style={{fontSize:10,color:INK,fontWeight:700,textTransform:'uppercase',letterSpacing:'.08em'}}>Transactions</div>
              <div style={{fontFamily:SERIF,fontSize:18,color:DARK,letterSpacing:'-.3px',fontWeight:500}}>{allTxns.length}</div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

/* ─── PROFILE ─── */
function ProfileScreen({fin,setFin,tweaks,setTweaks}) {
  const [draft,setDraft]=useState({...fin,age:fin.age||30});
  const [saved,setSaved]=useState(false);
  const nw=(draft.assets||0)-(draft.liabilities||0);
  const retireAge=(draft.age||30)+Math.round(fireMath(draft.income,draft.expenses,draft.assets,draft.liabilities,tweaks.returnRate/100,tweaks.safeWithdrawal/100,tweaks.inflation/100).yrs);
  const onSave=()=>{setFin(draft);setSaved(true);setTimeout(()=>setSaved(false),1800);};

  const Field=({label,value,onChange,prefix})=>(
    <div style={{marginBottom:18}}>
      <div style={{fontSize:13,fontWeight:700,color:DARK,marginBottom:8}}>{label}</div>
      <div style={{position:'relative'}}>
        {prefix&&<span style={{position:'absolute',left:18,top:'50%',transform:'translateY(-50%)',color:INK,fontWeight:600,fontSize:16}}>{prefix}</span>}
        <input type="number" value={value} onChange={e=>onChange(Math.max(0,+e.target.value))}
          style={{width:'100%',padding:prefix?'15px 18px 15px 38px':'15px 18px',background:'#faeee2',border:'none',borderRadius:100,fontFamily:SANS,fontSize:16,fontWeight:600,color:DARK,outline:'none'}}/>
      </div>
    </div>
  );

  const SliderRow=({label,value,min,max,step,onChange,display})=>(
    <div style={{marginBottom:16}}>
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:6}}>
        <span style={{fontSize:13,fontWeight:600,color:DARK}}>{label}</span>
        <span style={{fontSize:13,fontWeight:800,color:CORAL}}>{display}</span>
      </div>
      <div style={{position:'relative',height:8,background:BORDER,borderRadius:4}}>
        <div style={{position:'absolute',left:0,top:0,height:'100%',width:`${((value-min)/(max-min))*100}%`,background:CORAL,borderRadius:4}}/>
        <div style={{position:'absolute',top:'50%',left:`${((value-min)/(max-min))*100}%`,transform:'translate(-50%,-50%)',width:20,height:20,background:'white',borderRadius:'50%',border:`2.5px solid ${CORAL}`,pointerEvents:'none'}}/>
        <input type="range" min={min} max={max} step={step} value={value}
          onChange={e=>onChange(+e.target.value)}
          style={{position:'absolute',inset:0,width:'100%',opacity:0,cursor:'pointer',height:'100%',margin:0}}/>
      </div>
    </div>
  );

  const householdHint={
    individual:'Just you — enter your personal income and expenses.',
    couple:'Two adults — use your combined household income and expenses.',
    family:'Adults + kids — family costs are typically 40–70% higher than individual.',
  };

  return (
    <div style={{background:BG,minHeight:'100%',padding:'24px 22px 32px'}}>
      <div style={{fontSize:13,color:INK,fontWeight:600,marginBottom:4}}>Your numbers</div>
      <h1 style={{fontFamily:SERIF,fontSize:38,color:DARK,letterSpacing:'-.5px',lineHeight:1,marginBottom:22,fontWeight:500}}>Profile</h1>

      <div style={{background:CARD,borderRadius:26,padding:'22px 22px 8px',boxShadow:'0 2px 18px rgba(44,26,14,.06)',marginBottom:14}}>

        {/* Household dropdown */}
        <div style={{marginBottom:18}}>
          <div style={{fontSize:13,fontWeight:700,color:DARK,marginBottom:8}}>Household</div>
          <div style={{position:'relative'}}>
            <select value={tweaks.household} onChange={e=>setTweaks(t=>({...t,household:e.target.value}))}
              style={{width:'100%',padding:'14px 40px 14px 18px',background:'#faeee2',border:'none',borderRadius:100,fontFamily:SANS,fontSize:15,fontWeight:600,color:DARK,outline:'none',appearance:'none',cursor:'pointer'}}>
              <option value="individual">Individual — just me</option>
              <option value="couple">Couple — two adults</option>
              <option value="family">Family — adults + kids</option>
            </select>
            <div style={{position:'absolute',right:18,top:'50%',transform:'translateY(-50%)',pointerEvents:'none',color:INK,fontSize:12}}>▾</div>
          </div>
          <div style={{fontSize:12,color:INK,marginTop:8,paddingLeft:4}}>{householdHint[tweaks.household]}</div>
        </div>

        <div style={{height:1,background:BORDER,margin:'0 -22px 18px'}}/>

        {/* Age */}
        <Field label="Current age" value={draft.age} onChange={v=>setDraft(d=>({...d,age:v}))}/>
        <div style={{fontSize:13,color:INK,fontWeight:600,marginBottom:18,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <span>Estimated retirement age</span>
          <strong style={{color:CORAL,fontSize:16}}>{retireAge<120?retireAge:'—'}</strong>
        </div>

        <div style={{height:1,background:BORDER,margin:'0 -22px 18px'}}/>

        {/* Finances */}
        <div style={{fontSize:10,fontWeight:700,color:CORAL,textTransform:'uppercase',letterSpacing:'.1em',marginBottom:14}}>Finances</div>
        <Field label="Monthly income (after tax)" value={draft.income} onChange={v=>setDraft(d=>({...d,income:v}))} prefix="$"/>
        <Field label="Monthly expenses" value={draft.expenses} onChange={v=>setDraft(d=>({...d,expenses:v}))} prefix="$"/>
        <Field label="Total assets" value={draft.assets} onChange={v=>setDraft(d=>({...d,assets:v}))} prefix="$"/>
        <Field label="Total liabilities" value={draft.liabilities} onChange={v=>setDraft(d=>({...d,liabilities:v}))} prefix="$"/>
        <div style={{fontSize:13,color:INK,fontWeight:600,marginBottom:18,display:'flex',justifyContent:'space-between',alignItems:'center'}}>
          <span>Net worth</span>
          <strong style={{color:nw>=0?'#3d7a52':CORAL,fontSize:16}}>${nw.toLocaleString()}</strong>
        </div>

        <div style={{height:1,background:BORDER,margin:'0 -22px 18px'}}/>

        {/* Assumptions */}
        <div style={{fontSize:10,fontWeight:700,color:CORAL,textTransform:'uppercase',letterSpacing:'.1em',marginBottom:16}}>Assumptions</div>
        <SliderRow label="Expected return" value={tweaks.returnRate} min={3} max={12} step={0.5}
          onChange={v=>setTweaks(t=>({...t,returnRate:v}))} display={`${tweaks.returnRate}% / yr`}/>
        <SliderRow label="Inflation rate" value={tweaks.inflation} min={1} max={6} step={0.5}
          onChange={v=>setTweaks(t=>({...t,inflation:v}))} display={`${tweaks.inflation}% / yr`}/>
        <SliderRow label="Safe withdrawal rate" value={tweaks.safeWithdrawal} min={2} max={6} step={0.25}
          onChange={v=>setTweaks(t=>({...t,safeWithdrawal:v}))} display={`${tweaks.safeWithdrawal}%`}/>
        <div style={{marginBottom:14,padding:'12px 14px',background:BG,borderRadius:14,fontSize:12,color:INK,lineHeight:1.6}}>
          Real return <strong style={{color:CORAL}}>{(((1+tweaks.returnRate/100)/(1+tweaks.inflation/100)-1)*100).toFixed(1)}%</strong> after inflation · FIRE = <strong style={{color:CORAL}}>{Math.round(1/tweaks.safeWithdrawal*100)}× annual expenses</strong>
        </div>
      </div>

      {/* Save — always visible */}
      <Btn onClick={onSave} variant="primary" full style={{padding:'16px',fontSize:15,marginBottom:10,background:saved?'#3d7a52':DARK}}>
        {saved?'✓ Saved!':'Save changes'}
      </Btn>

      <div style={{background:'#fde4d7',borderRadius:22,padding:'14px 18px',display:'flex',alignItems:'center',gap:12}}>
        <span style={{fontSize:20}}>♡</span>
        <div style={{fontSize:12,color:DARK,opacity:.7}}>Numbers are private. Nothing leaves your device.</div>
      </div>
    </div>
  );
}


/* ─── APP ─── */
const TWEAK_DEFAULTS={returnRate:7,safeWithdrawal:4,inflation:3,showMascot:true,household:'individual'};

function App() {
  useEffect(injectFonts,[]);
  const [stage,setStage]=useState('onboarding');
  const [tab,setTab]=useState('home');
  const [fin,setFin]=useState({income:8000,expenses:5000,assets:50000,liabilities:20000});
  const [tweaks,setTweaks]=useState(TWEAK_DEFAULTS);
  const res=useMemo(()=>fireMath(fin.income,fin.expenses,fin.assets,fin.liabilities,tweaks.returnRate/100,tweaks.safeWithdrawal/100,tweaks.inflation/100),[fin,tweaks]);
  const onDone=f=>{setFin(f);setTweaks(t=>({...t,household:f.household||'individual'}));setStage('main');setTab('home');};

  const frameStyle={
    width:'100%',maxWidth:390,height:'100vh',maxHeight:844,
    background:BG,display:'flex',flexDirection:'column',
    fontFamily:SANS,color:DARK,overflow:'hidden',
    boxShadow:'0 20px 60px rgba(0,0,0,.15)',borderRadius:0,
    position:'relative',
  };

  return (
    <div style={{minHeight:'100vh',background:'#e8ddd4',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:SANS}}>
      <div style={frameStyle}>
        <SBar onDark={stage!=='onboarding'}/>
        {stage==='onboarding'
          ?<div style={{flex:1,overflowY:'auto',overflowX:'hidden',scrollbarWidth:'none'}}><Onboarding onDone={onDone}/></div>
          :<>
            <div style={{flex:1,overflowY:'auto',overflowX:'hidden',scrollbarWidth:'none'}} key={tab}>
              {tab==='home'&&<HomeScreen fin={fin} setFin={setFin} res={res} showMascot={tweaks.showMascot}/>}
              {tab==='projections'&&<ProjectionsScreen fin={fin} res={res} tweaks={tweaks}/>}
              {tab==='spending'&&<SpendingScreen fin={fin} res={res}/>}
              {tab==='profile'&&<ProfileScreen fin={fin} setFin={setFin} tweaks={tweaks} setTweaks={setTweaks}/>}
            </div>
            <BNav active={tab} setActive={setTab}/>
          </>
        }
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
  </script>
</body>
</html>
