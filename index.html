  let id = 0;

    const catTotal = Math.round(expenses * c.ratio);
    const ms = MERCHANTS[c.name] || [];
    let rem = catTotal;
    ms.forEach((m, i) => {
      const isLast = i === ms.length - 1;
      const a = isLast ? rem : Math.max(5, Math.round(catTotal * m.a * (0.85 + Math.random() * 0.3)));

        id: ++id,
        merchant: m.n,
        amount: a,
        cat: c.name,
        color: c.color,
        bg: c.bg,
        icon: c.icon,
        day
      });
    });
  });
  return txns.sort((a, b) => b.day - a.day);
